<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두더지 잡기 게임</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .info-panel {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 15px;
            background-color: #8b5a2b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .hole {
            width: 120px;
            height: 120px;
            background-color: #5c3a21;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 4px solid #3d2314;
            cursor: pointer;
        }

        .mole {
            width: 90px;
            height: 90px;
            background-color: #a52a2a;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            bottom: -100px;
            left: 15px;
            transition: bottom 0.1s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 두더지 얼굴 요소 */
        .mole::before {
            content: '👀';
            font-size: 24px;
            margin-top: -10px;
        }
        .mole::after {
            content: '👃';
            font-size: 16px;
            margin-top: -5px;
        }

        /* 두더지가 올라왔을 때 */
        .hole.up .mole {
            bottom: 10px;
        }

        /* 잡혔을 때 효과 */
        .mole.hit {
            background-color: #ff4500;
        }
        .mole.hit::before {
            content: '😵';
        }

        button {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>🔨 두더지 잡기 게임</h1>
    
    <div class="info-panel">
        <div>점수: <span id="score">0</span></div>
        <div>남은 시간: <span id="time-left">30</span>초</div>
    </div>

    <div class="grid">
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
    </div>

    <button id="start-btn" onclick="startGame()">게임 시작</button>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreDisplay = document.getElementById('score');
        const timeLeftDisplay = document.getElementById('time-left');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let lastHole;
        let timeUp = false;
        let countdown;
        let moleTimer;
        let timeLeft = 30;

        // 랜덤 시간 생성 (두더지가 나와있는 시간)
        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        // 랜덤 구멍 선택
        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        // 두더지 나타나기
        function peep() {
            const time = randomTime(500, 1000); // 0.5초 ~ 1초 사이
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');
            
            mole.classList.remove('hit');
            hole.classList.add('up');

            moleTimer = setTimeout(() => {
                hole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        // 게임 시작
        function startGame() {
            // 초기화
            score = 0;
            timeLeft = 30;
            timeUp = false;
            scoreDisplay.textContent = 0;
            timeLeftDisplay.textContent = timeLeft;
            startBtn.disabled = true;

            // 카운트다운 타이머
            countdown = setInterval(() => {
                timeLeft--;
                timeLeftDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timeUp = true;
                    startBtn.disabled = false;
                    alert(`게임 종료! 최종 점수: ${score}점`);
                }
            }, 1000);

            peep();
        }

        // 두더지 클릭(잡기) 이벤트
        function bonk(e) {
            if (!e.isTrusted) return; // 자바스크립트로 가짜 클릭 방지
            
            const hole = this.parentNode;
            
            // 이미 잡힌 두더지이거나 안 올라온 두더지면 무시
            if (!hole.classList.contains('up') || this.classList.contains('hit')) return;

            this.classList.add('hit');
            score++;
            scoreDisplay.textContent = score;

            // 클릭 후 빠르게 내려가기
            setTimeout(() => {
                hole.classList.remove('up');
            }, 200);
        }

        // 모든 두더지에 클릭 이벤트 등록
        const moles = document.querySelectorAll('.mole');
        moles.forEach(mole => mole.addEventListener('click', bonk));
    </script>
</body>
</html>
